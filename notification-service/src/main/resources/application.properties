# -----------------------------------
# SERVER CONFIG
# -----------------------------------
server.port=${PORT:8093}
spring.application.name=notification-service
health.services.userService=http://localhost:8091/api/v1/users/instructor
health.services.courseService=http://localhost:8083/api/v1/courses
health.timeout=2000

# -----------------------------------
# DATABASE (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:lms_notification_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cyberlearnix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cyberlearnix123}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------
# JPA / HIBERNATE
# -----------------------------------
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.default-property-inclusion=non_empty

# -----------------------------------
# LOGGING
# -----------------------------------
logging.level.org.springframework=INFO
logging.level.com.example.notification=DEBUG

# -----------------------------------
# KAFKA (optional for later)
# -----------------------------------
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

app.kafka.topic.user-login=user-login-topic
app.kafka.topic.user-login-dlt=user-login-topic-dlt
app.kafka.retry.max-attempts=3
app.kafka.retry.interval-ms=1000

# -----------------------------------
# REDIS (optional for caching)
# -----------------------------------
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# -----------------------------------
# EMAIL (SMTP)
# -----------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=cyberlearnix@gmail.com
spring.mail.password=vdwc qugf czfw mkrh
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -----------------------------------
# JWT (for security later)
# -----------------------------------
jwt.expiration=3600000
jwt.access-token.secret=8c4e9d2f1a7b6c5d9e3f0a1b7c8d4e5f9a2b6c1d8e7f3a4b5c9d1e6f8a2b7c3

# -----------------------------------
# FIREBASE (Push Notifications)
# -----------------------------------
firebase.service-account.path=firebase-service-account.json

# -----------------------------------
# WHATSAPP NOTIFICATIONS (Twilio / Meta)
# -----------------------------------
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp-from-number=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

# -----------------------------------
# SECURITY VERIFICATION
# -----------------------------------
app.security.base-url=${APP_SECURITY_BASE_URL:https://cyberlearnix.com}

# -----------------------------------
# NOTIFICATION RATE LIMITING
# -----------------------------------
# Max login alerts per user in the sliding window (default: 3 alerts per 15 minutes)
app.notification.rate-limit.max-alerts=${NOTIF_RATE_MAX:3}
app.notification.rate-limit.window-minutes=${NOTIF_RATE_WINDOW_MINUTES:15}
