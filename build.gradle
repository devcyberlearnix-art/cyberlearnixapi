plugins {
    id 'base'
    id 'idea'
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

group = 'com.cyberlearnix'
version = '0.0.1-SNAPSHOT'

allprojects {
    apply plugin: 'idea'
    repositories {
        mavenCentral()
    }

    // Apply common Java configuration to all Java projects
    plugins.withType(JavaPlugin) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }
}

subprojects {
    configurations.all {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    plugins.withType(JavaPlugin) {
        plugins.withId('org.springframework.boot') {
            dependencies.add('implementation', 'org.springframework.boot:spring-boot-starter-actuator')
            tasks.named('jar') {
                enabled = false
            }
        }
    }
}

// Build optimization tasks
tasks.register('cleanAll') {
    description = 'Clean all subprojects'
    group = 'build'
    dependsOn subprojects.collect { it.tasks.named('clean') }
}

tasks.register('buildAll') {
    description = 'Build all subprojects'
    group = 'build'
    dependsOn subprojects.collect { it.tasks.matching { it.name == 'build' } }
}

