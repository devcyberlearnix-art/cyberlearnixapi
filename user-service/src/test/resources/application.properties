# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Cloudinary Test Configuration
cloudinary.cloud-name=test-cloud-name
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret
cloudinary.folder=test-folder

# Google Drive Test Configuration
google.drive.client-id=test-client-id
google.drive.client-secret=test-client-secret
google.drive.refresh-token=test-refresh-token
google.drive.folder-id=test-folder-id

# JWT Test Configuration
jwt.secret=test-secret-key-for-jwt-token-generation-very-long
jwt.expiration=3600000

# Application Test Configuration
app.otp.expiry-minutes=5
app.otp.log-value=true
