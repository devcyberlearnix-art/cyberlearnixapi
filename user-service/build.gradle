plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.3'
	id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.user'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    // Spring Core
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // PostgreSQL
    runtimeOnly "org.postgresql:postgresql:${postgresqlVersion}"

    // H2 in-memory DB (local/dev testing without Docker)
    testRuntimeOnly "com.h2database:h2:${h2Version}"

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Mail (OTP)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // JWT (Nimbus - RS256 support)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation "eu.bitwalker:UserAgentUtils:${userAgentUtilsVersion}"

    // Bucket4j Rate Limiting
    implementation "com.bucket4j:bucket4j-core:${bucket4jVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "org.jasypt:jasypt:${jasyptVersion}"
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // Cloudinary SDK
    implementation "com.cloudinary:cloudinary-http5:${cloudinaryVersion}"

    // SpringDoc OpenAPI
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Common Libraries (for shared utilities)
    implementation project(':commonlibs')

    // JWT dependencies for custom JWT service
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Test
    implementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

