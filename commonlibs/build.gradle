plugins {
    id 'java-library'
}

group = 'com.cyberlearnix'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Only add what is needed for compile-time (annotations, etc.)
    compileOnly 'org.springframework:spring-web:6.2.8'
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    compileOnly 'org.hibernate:hibernate-core:6.4.4.Final'
    compileOnly 'org.springframework.data:spring-data-jpa:3.2.5'
    implementation("org.projectlombok:lombok:1.18.30")
    annotationProcessor("org.projectlombok:lombok:1.18.30")
    
    // Swagger/OpenAPI for API documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
    
    // Validation annotations
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    
    // Test dependencies (commonlibs needs basic testing but not Spring Boot Test)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
}

// Create test JAR to share test utilities with other modules
task testJar(type: Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}

// Make test classes available to other modules
configurations {
    testArtifacts
}

artifacts {
    testArtifacts testJar
}

java {
    withJavadocJar()
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}