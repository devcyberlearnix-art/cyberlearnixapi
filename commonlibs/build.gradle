plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.cyberlearnix'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Keep commonlibs framework-light and domain-free.
    compileOnly 'org.springframework:spring-web:6.2.8'
    compileOnly 'jakarta.validation:jakarta.validation-api:3.0.2'
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // JWT dependencies for shared JWT validator
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    implementation "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Spring Security for JWT filter
    compileOnly 'org.springframework.security:spring-security-web:6.2.1'
    compileOnly 'org.springframework.security:spring-security-config:6.2.1'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // SLF4J for logging
    compileOnly 'org.slf4j:slf4j-api:2.0.9'

    // Shared test utilities only
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
}

// Create test JAR to share test utilities with other modules
task testJar(type: Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}

// Make test classes available to other modules
configurations {
    testArtifacts
}

artifacts {
    testArtifacts testJar
}

java {
    withJavadocJar()
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'commonlibs'
        }
    }
}
