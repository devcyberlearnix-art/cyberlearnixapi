plugins {
    id 'java-library'
}

group = 'com.cyberlearnix'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Keep commonlibs framework-light and domain-free.
    compileOnly 'org.springframework:spring-web:6.2.8'
    compileOnly 'jakarta.validation:jakarta.validation-api:3.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // JWT dependencies for shared JWT validator
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Spring Security for JWT filter
    compileOnly 'org.springframework.security:spring-security-web:6.2.1'
    compileOnly 'org.springframework.security:spring-security-config:6.2.1'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // SLF4J for logging
    compileOnly 'org.slf4j:slf4j-api:2.0.9'

    // Shared test utilities only
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
}

// Create test JAR to share test utilities with other modules
task testJar(type: Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}

// Make test classes available to other modules
configurations {
    testArtifacts
}

artifacts {
    testArtifacts testJar
}

java {
    withJavadocJar()
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}