server.port=${SERVER_PORT:8086}
spring.application.name=userservice

# Database – userservice owns lms_user_db exclusively
# No other service touches this database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lms_user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cyberlearnix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cyberlearnix123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis (shared infrastructure, not a DB – session store only)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Mail (required for JavaMailSender bean)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:mallibhai7876@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:wfkhcovkaoycstka}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}

# Security
spring.security.user.name=user
spring.security.user.password=password

# OAuth2 client defaults (override via env for real credentials)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_CLIENT_SCOPE:email,profile}

# JWT
jwt.access-token.secret=${JWT_ACCESS_TOKEN_SECRET:myVerySecretKeyForAccessTokenThatIsAtLeast32CharactersLongForHS256Algorithm}
jwt.access-token.expiration-minutes=15
jwt.refresh-token.secret=${JWT_REFRESH_TOKEN_SECRET:myVerySecretKeyForRefreshTokenThatIsAtLeast32Chars}
jwt.refresh-token.expiration-days=30

# Encryption key used by EncryptionUtil (16/24/32 chars for AES)
app.encryption-key=${APP_ENCRYPTION_KEY:1234567890123456}

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=false

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
