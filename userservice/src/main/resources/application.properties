server.port=${SERVER_PORT:8086}
spring.application.name=userservice

# Database – userservice owns lms_user_db exclusively
# No other service touches this database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lms_user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cyberlearnix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cyberlearnix123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis (shared infrastructure, not a DB – session store only)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Security
spring.security.user.name=user
spring.security.user.password=password

# JWT
jwt.access-token.secret=${JWT_ACCESS_TOKEN_SECRET:myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
jwt.access-token.expiration-minutes=15
jwt.refresh-token.secret=${JWT_REFRESH_TOKEN_SECRET:myVerySecretKeyForRefreshTokenThatIsAtLeast32Chars}
jwt.refresh-token.expiration-days=30

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
