# H2 file DB for local testing (overrides PostgreSQL)
spring.datasource.url=jdbc:h2:file:C:/temp/lms_h2;AUTO_SERVER=TRUE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JWT (local test secrets - at least 32 chars)
jwt.access-token.secret=localTestSecretKeyThatIsAtLeast32CharactersLong
jwt.access-token.expiration-minutes=60
jwt.refresh-token.secret=localTestRefreshSecretKeyThatIsAtLeast32CharactersLong
jwt.refresh-token.expiration-days=7

# Encryption key (must be exactly 16, 24, or 32 chars)
app.encryption.key=CyberLearnix1234

# OAuth2 (dummy - security is disabled for localtest)
spring.security.oauth2.client.registration.google.client-id=dummy-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Logging
logging.level.org.springframework.security=DEBUG

# Disable OAuth2 auto-config for localtest
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Fake SMTP config so JavaMailSender bean is created (emails won't actually send - that's OK)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@cyberlearnix.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Log SQL parameters so we can see OTP values in local testing
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.type.descriptor.sql=TRACE

spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
