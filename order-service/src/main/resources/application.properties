spring.application.name=order-service
# ---------------- SERVER ----------------
server.port=${SERVER_PORT:8084}

# ---------------- DATABASE (PostgreSQL) ----------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lms_order_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cyberlearnix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cyberlearnix123}

spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------- JPA / HIBERNATE ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------------- LOGGING ----------------
logging.level.org.springframework=INFO
logging.level.com.lms.orderservice=DEBUG

# ---------------- ACTUATOR (OPTIONAL) ----------------
management.endpoints.web.exposure.include=*

# ---------------- JWT (IF YOU ADD SECURITY LATER) ----------------
jwt.secret=${JWT_SECRET:your-secret-key}
jwt.expiration=${JWT_EXPIRATION:3600000}

# JWT (used by security filter; must match userservice/gateway)
jwt.access-token.secret=${JWT_ACCESS_TOKEN_SECRET:myVerySecretKeyForAccessTokenThatIsAtLeast32CharactersLongForHS256Algorithm}

# ---------------- MICROSERVICES (FUTURE USE) ----------------
cart.service.url=${CART_SERVICE_URL:http://localhost:8081}
coupon.service.url=${COUPON_SERVICE_URL:http://localhost:8082}