spring.application.name=order-service
# ---------------- SERVER ----------------
server.port=${SERVER_PORT:8084}

# ---------------- DATABASE (PostgreSQL) ----------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:lms_order_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cyberlearnix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cyberlearnix123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------- JPA / HIBERNATE ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------------- LOGGING ----------------
logging.level.org.springframework=INFO
logging.level.com.lms.orderservice=DEBUG

# ---------------- ACTUATOR (OPTIONAL) ----------------
management.endpoints.web.exposure.include=*

# ---------------- JWT (IF YOU ADD SECURITY LATER) ----------------
jwt.secret=${JWT_SECRET:8c4e9d2f1a7b6c5d9e3f0a1b7c8d4e5f9a2b6c1d8e7f3a4b5c9d1e6f8a2b7c3}
jwt.issuer=${JWT_ISSUER:cyberlearnix}
jwt.audience=${JWT_AUDIENCE:cyberlearnix-clients}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ---------------- MICROSERVICES (FUTURE USE) ----------------
cart.service.url=${CART_SERVICE_URL:http://localhost:8081}
coupon.service.url=${COUPON_SERVICE_URL:http://localhost:8082}