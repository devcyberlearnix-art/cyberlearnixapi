server.port=${SERVER_PORT:8083}
spring.application.name=course-service

# Database – course-service owns lms_course_db exclusively
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:lms_course_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cyberlearnix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cyberlearnix123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Data Initialization
spring.sql.init.mode=never

# Security
spring.security.user.name=user
spring.security.user.password=password

# JWT (used to validate tokens issued by userservice)
jwt.secret=${JWT_SECRET:8c4e9d2f1a7b6c5d9e3f0a1b7c8d4e5f9a2b6c1d8e7f3a4b5c9d1e6f8a2b7c3}
jwt.issuer=${JWT_ISSUER:cyberlearnix}
jwt.audience=${JWT_AUDIENCE:cyberlearnix-clients}

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

review-service.url=${REVIEW_SERVICE_URL:http://localhost:8089}
user-service.url=${USER_SERVICE_URL:http://localhost:8091}

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
spring.data.redis.timeout=2000ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# Service-to-Service Authentication
service.auth.enabled=${SERVICE_AUTH_ENABLED:false}
service.auth.secret=${SERVICE_AUTH_SECRET:course-service-secret-key-2024}
service.auth.header-name=${SERVICE_AUTH_HEADER:X-Service-Auth}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dmvmvdefr}
cloudinary.api-key=${CLOUDINARY_API_KEY:624633947864525}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:SHlUhJ6NmdV6bGzWvrZP6XRFyOA}
cloudinary.folder=${CLOUDINARY_FOLDER:cyberlearnix}

# Multipart / File Upload configuration (allows video uploads up to 500MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Observability and Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.tracing.enabled=false