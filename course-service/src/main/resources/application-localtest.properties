# Localtest profile for Course Service - H2 Database

# H2 file DB for local testing (overrides PostgreSQL)
spring.datasource.url=jdbc:h2:file:C:/temp/lms_course_h2;AUTO_SERVER=TRUE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA for H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JWT (local test secrets - at least 32 chars)
jwt.secret=${JWT_ACCESS_TOKEN_SECRET:localTestSecretKeyThatIsAtLeast32CharactersLong}
jwt.issuer=${JWT_ISSUER:cyberlearnix}
jwt.audience=${JWT_AUDIENCE:cyberlearnix-clients}

# Service URLs
review-service.url=http://localhost:8089
user-service.url=http://localhost:8091

# Redis (optional for localtest - will fail gracefully if not available)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true