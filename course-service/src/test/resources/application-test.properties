# Test Database - H2 in-memory for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Google Drive dummy properties for tests
google.client-id=test-client-id
google.client-secret=test-client-secret
google.refresh-token=test-refresh-token
google.folder-id=test-folder-id

# Disable Redis in tests, use simple in-memory cache
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=simple

# Disable service auth in tests
service.auth.enabled=false

# Disable virtual threads in tests
spring.threads.virtual.enabled=false

# Cloudinary - use test credentials
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
cloudinary.folder=test

# JWT - use test secret
jwt.secret=test-secret-key-for-testing-only-12345678901234567890123456789012
jwt.issuer=test
jwt.audience=test

# Disable external services in tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Disable SQL initialization
spring.sql.init.mode=never

# Logging
logging.level.root=WARN
logging.level.com.lms.courseservice=WARN
