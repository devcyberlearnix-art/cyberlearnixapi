spring.profiles.active=test

# Test Database - H2 in-memory for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway in tests (let JPA create schema)
spring.flyway.enabled=false

# Disable Redis in tests
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=none

# Disable service auth in tests
service.auth.enabled=false

# Cloudinary - use test credentials
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
cloudinary.folder=test

# JWT - use test secret
jwt.secret=test-secret-key-for-testing-only
jwt.issuer=test
jwt.audience=test

# Logging
logging.level.root=WARN
logging.level.com.lms.courseservice=DEBUG
