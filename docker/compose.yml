# CyberLearnix LMS - Full Stack Docker Compose
# Run from project root:
# docker compose -f docker/compose.yml up --build -d

services:
  # Infrastructure
  postgres:
    image: postgres:16-alpine
    container_name: cyberlearnix-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-cyberlearnix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      POSTGRES_DB: lms_user_db
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cyberlearnix} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cyberlearnix-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cyberlearnix-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # Microservices
  user-service:
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    image: cyberlearnix/user-service:latest
    container_name: cyberlearnix-user-service
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: 8091
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ADMIN_SERVICE_URL: http://admin-service:8087
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_SECRET:-myVerySecretKeyForRefreshTokenThatIsAtLeast32Chars}
      DB_HOST: postgres
      DB_PORT: 5432
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_SMTP_STARTTLS: "false"
      SPRING_MAIL_SMTP_STARTTLS_REQUIRED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped

  course-service:
    build:
      context: ..
      dockerfile: course-service/Dockerfile
    image: cyberlearnix/course-service:latest
    container_name: cyberlearnix-course-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_course_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      JWT_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cart-service:
    build:
      context: ..
      dockerfile: cart-service/Dockerfile
    image: cyberlearnix/cart-service:latest
    container_name: cyberlearnix-cart-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_cart_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      COUPON_SERVICE_URL: http://coupon-service:8082
      INSTRUCTOR_SERVICE_URL: http://instructor-service:8088
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  coupon-service:
    build:
      context: ..
      dockerfile: coupon-service/Dockerfile
    image: cyberlearnix/coupon-service:latest
    container_name: cyberlearnix-coupon-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_coupon_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    image: cyberlearnix/api-gateway:latest
    container_name: cyberlearnix-api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: production
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3002
      USER_SERVICE_URL: http://user-service:8091
      USERSERVICE_URL: http://user-service:8091
      ADMIN_SERVICE_URL: http://admin-service:8087
      COURSESERVICE_URL: http://course-service:8083
      CARTSERVICE_URL: http://cart-service:8081
      COUPONSERVICE_URL: http://coupon-service:8082
      WISHLISTSERVICE_URL: http://wishlist-service:8090
      ORDERSERVICE_URL: http://order-service:8084
      PAYMENTSERVICE_URL: http://payment-service:8085
      INSTRUCTOR_SERVICE_URL: http://instructor-service:8088
      REVIEWSERVICE_URL: http://review-service:8089
      NOTIFICATIONSERVICE_URL: http://notification-service:8093
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_SECRET:-myVerySecretKeyForRefreshTokenThatIsAtLeast32Chars}
    depends_on:
      user-service:
        condition: service_started
      course-service:
        condition: service_started
      cart-service:
        condition: service_started
      coupon-service:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin-service:
    build:
      context: ..
      dockerfile: admin-service/Dockerfile
    image: cyberlearnix/admin-service:latest
    container_name: cyberlearnix-admin-service
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_admin_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      USER_SERVICE_URL: http://user-service:8091
      COURSE_SERVICE_URL: http://course-service:8083
      INSTRUCTOR_SERVICE_URL: http://instructor-service:8088
      ORDER_SERVICE_URL: http://order-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      REVIEW_SERVICE_URL: http://review-service:8089
      CART_SERVICE_URL: http://cart-service:8081
      COUPON_SERVICE_URL: http://coupon-service:8082
      WISHLIST_SERVICE_URL: http://wishlist-service:8090
      NOTIFICATION_SERVICE_URL: http://notification-service:8093
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DB_HOST: postgres
      DB_PORT: 5432
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_SMTP_STARTTLS: "false"
      SPRING_MAIL_SMTP_STARTTLS_REQUIRED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped

  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    image: cyberlearnix/order-service:latest
    container_name: cyberlearnix-order-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_order_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      CART_SERVICE_URL: http://cart-service:8081
      COUPON_SERVICE_URL: http://coupon-service:8082
      DB_HOST: postgres
      DB_PORT: 5432
      COURSE_SERVICE_URL: http://course-service:8083
      USER_SERVICE_URL: http://user-service:8091
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: ..
      dockerfile: payment-service/Dockerfile
    image: cyberlearnix/payment-service:latest
    container_name: cyberlearnix-payment-service
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_payment_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      PAYMENT_CALLBACK_BASE_URL: http://payment-service:8085
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  review-service:
    build:
      context: ..
      dockerfile: review-service/Dockerfile
    image: cyberlearnix/review-service:latest
    container_name: cyberlearnix-review-service
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_review_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      ENROLLMENT_SERVICE_URL: http://course-service:8083
      COURSE_SERVICE_URL: http://course-service:8083
      USER_SERVICE_URL: http://user-service:8091
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  instructor-service:
    build:
      context: ..
      dockerfile: instructor-service/Dockerfile
    image: cyberlearnix/instructor-service:latest
    container_name: cyberlearnix-instructor-service
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_instructor_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  wishlist-service:
    build:
      context: ..
      dockerfile: wishlist-service/Dockerfile
    image: cyberlearnix/wishlist-service:latest
    container_name: cyberlearnix-wishlist-service
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_wishlist_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      COURSE_SERVICE_URL: http://course-service:8083
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    image: cyberlearnix/notification-service:latest
    container_name: cyberlearnix-notification-service
    ports:
      - "8093:8093"
    environment:
      SERVER_PORT: 8093
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_notification_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      DB_HOST: postgres
      DB_PORT: 5432
      USER_SERVICE_URL: http://user-service:8091
      COURSE_SERVICE_URL: http://course-service:8083
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_SMTP_STARTTLS: "false"
      SPRING_MAIL_SMTP_STARTTLS_REQUIRED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
