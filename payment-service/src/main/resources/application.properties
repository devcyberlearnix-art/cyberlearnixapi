server.port=8085
# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# PayU Configuration
payu.key=${PAYU_MERCHANT_KEY:XidEdD}
payu.salt=${PAYU_SALT:4JPMTxOzkJMchiHLrdFcSgkcXTuzx1Bd}
# Example values:
# - Test: https://test.payu.in
# - Prod: https://secure.payu.in
payu.base-url=${PAYU_BASE_URL:https://secure.payu.in}
# PayU command endpoint path (docs sometimes show /merchant/postservice or /merchant/postservice.php)
payu.postservice-path=${PAYU_POSTSERVICE_PATH:/merchant/postservice}

# PayU Payment Links (OneAPI)
payu.payment-links.base-url=${PAYU_PAYMENT_LINKS_BASE_URL:https://uatoneapi.payu.in}

# Invoice config
invoice.merchant.name=${INVOICE_MERCHANT_NAME:ABC Technologies}
invoice.merchant.gstin=${INVOICE_MERCHANT_GSTIN:36ABCDE1234F1Z5}
invoice.merchant.email=${INVOICE_MERCHANT_EMAIL:support@abc.com}
invoice.gst.rate=${INVOICE_GST_RATE:0.18}

# Security Mock JWT (for testing)
jwt.secret=mock_secret_key_mock_secret_key_mock_secret_key_mock_secret_key

# Service Integration
payment.callback-base-url=${PAYMENT_CALLBACK_BASE_URL:http://localhost:8085}