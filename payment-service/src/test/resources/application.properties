# Test Configuration - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration for Testing
jwt.secret=mock_secret_key_mock_secret_key_mock_secret_key_mock_secret_key
jwt.issuer=cyberlearnix
jwt.audience=cyberlearnix-clients

# PayU dummy config for tests
payu.key=test_key
payu.salt=test_salt
payu.base-url=https://test.payu.in

