server.port=${SERVER_PORT:8087}

spring.application.name=admin-service

# Database - admin-service owns lms_admin_db exclusively
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:lms_admin_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cyberlearnix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cyberlearnix123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

user.service.url=${USER_SERVICE_URL:http://localhost:8091}
user.service.token=admin-service-secret-token

course-service.url=${COURSE_SERVICE_URL:http://localhost:8083}
course-service.token=admin-service-secret-token

instructor-service.url=${INSTRUCTOR_SERVICE_URL:http://localhost:8088}

order-service.url=${ORDER_SERVICE_URL:http://localhost:8084}

payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8085}

review-service.url=${REVIEW_SERVICE_URL:http://localhost:8089}

cart-service.url=${CART_SERVICE_URL:http://localhost:8081}

coupon-service.url=${COUPON_SERVICE_URL:http://localhost:8082}

wishlist-service.url=${WISHLIST_SERVICE_URL:http://localhost:8090}

notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8093}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security
spring.security.user.name=user
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:password}

# JWT (used to validate tokens issued by userservice)
jwt.secret=${JWT_SECRET:8c4e9d2f1a7b6c5d9e3f0a1b7c8d4e5f9a2b6c1d8e7f3a4b5c9d1e6f8a2b7c3}
jwt.issuer=${JWT_ISSUER:cyberlearnix}
jwt.audience=${JWT_AUDIENCE:cyberlearnix-clients}
jwt.access.expiration=3600000
jwt.refresh.expiration=604800000

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# ===============================

# EMAIL CONFIGURATION (OTP)

# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=cyberlearnix@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD:qxzn mhwz tigg iywl}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false
