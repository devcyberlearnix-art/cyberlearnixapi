# Test Configuration - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Disable Redis for testing
spring.redis.host=
spring.redis.port=

# Disable mail for testing
spring.mail.host=

# JWT Configuration for testing
jwt.secret=test-secret-key-for-testing-only
jwt.issuer=test-issuer
jwt.audience=test-audience
jwt.access.expiration=3600000
jwt.refresh.expiration=604800000

# Security
spring.security.user.name=user
spring.security.user.password=password

# Service URLs for testing (mocked)
user.service.url=http://localhost:8091
user.service.token=test-token
course-service.url=http://localhost:8083
course-service.token=test-token
instructor-service.url=http://localhost:8088
order-service.url=http://localhost:8084
payment-service.url=http://localhost:8085
review-service.url=http://localhost:8089
cart-service.url=http://localhost:8081
coupon-service.url=http://localhost:8082
wishlist-service.url=http://localhost:8090
notification-service.url=http://localhost:8093

# Main admin for testing
main.admin.email=testadmin@cyberlearnix.com
main.admin.password=TestAdmin@123
main.admin.first-name=Test
main.admin.last-name=Admin
main.admin.mobile-number=+919876543210

# Logging
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
