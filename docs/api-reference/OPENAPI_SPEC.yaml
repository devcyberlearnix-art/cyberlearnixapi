openapi: 3.0.3
info:
  title: ASIVO LMS API
  description: |
    Complete API reference for the Asivo LMS backend microservices architecture.
    
    This specification covers the most critical and commonly used endpoints.
    For a complete inventory of all 127+ endpoints, see API_ENDPOINT_INVENTORY.csv.
    
    **Base URL**: http://localhost:8080 (API Gateway)
    
    **Authentication**: JWT Bearer tokens
    
    **Documentation Status**: SOURCE VERIFIED
  version: 1.0.0
  contact:
    name: ASIVO LMS Backend Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Development API Gateway
  - url: https://api.cyberlearnix.com
    description: Production API Gateway

tags:
  - name: Authentication
    description: User registration, login, and token management
  - name: User Profile
    description: User profile management
  - name: Sessions
    description: Session management
  - name: Courses
    description: Course catalog and details
  - name: Enrollments
    description: Course enrollment
  - name: Cart
    description: Shopping cart
  - name: Orders
    description: Order management
  - name: Payments
    description: Payment processing
  - name: Reviews
    description: Course reviews
  - name: Wishlist
    description: Course wishlist

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (15 minute expiration)

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true
        timestamp:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - confirmPassword
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        confirmPassword:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        mobileNumber:
          type: string
        countryCode:
          type: string
        dob:
          type: string
          format: date
        profilePhoto:
          type: string
          format: uri
        city:
          type: string
        state:
          type: string
        country:
          type: string
        preferredLanguage:
          type: string
        organization:
          type: string
        skills:
          type: array
          items:
            type: string
        fieldOfStudy:
          type: string
        highestQualification:
          type: string

    VerifyOtpRequest:
      type: object
      required:
        - email
        - otp
        - otpSessionId
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: '^[0-9]{6}$'
        otpSessionId:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        authentication:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            tokenType:
              type: string
              enum: [Bearer]
            expiresIn:
              type: integer
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            role:
              type: string
            status:
              type: string
        sessionInfo:
          type: object
          properties:
            sessionId:
              type: string
            deviceId:
              type: string
            deviceName:
              type: string
            ipAddress:
              type: string
            location:
              type: string

    RefreshTokenResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
        timestamp:
          type: string
          format: date-time

    UserProfileResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        mobile:
          type: string
        countryCode:
          type: string
        dob:
          type: string
          format: date
        city:
          type: string
        state:
          type: string
        country:
          type: string
        preferredLanguage:
          type: string
        organization:
          type: string
        skills:
          type: array
          items:
            type: string
        fieldOfStudy:
          type: string
        highestQualification:
          type: string
        profilePhoto:
          type: string
          format: uri
        coverPhoto:
          type: string
          format: uri
        role:
          type: string
        status:
          type: string
        isInstructorApproved:
          type: boolean
        effectiveRole:
          type: string
        createdAt:
          type: string
          format: date-time

    UpdateUserProfileRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        mobile:
          type: string
        countryCode:
          type: string
        dob:
          type: string
          format: date
        city:
          type: string
        state:
          type: string
        country:
          type: string
        preferredLanguage:
          type: string
        organization:
          type: string
        skills:
          type: array
          items:
            type: string
        fieldOfStudy:
          type: string
        highestQualification:
          type: string

    SessionDto:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
          format: uuid
        email:
          type: string
        deviceInfo:
          type: string
        deviceId:
          type: string
        deviceName:
          type: string
        deviceType:
          type: string
        browser:
          type: string
        operatingSystem:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        city:
          type: string
        country:
          type: string
        ipAddress:
          type: string
        loginTime:
          type: string
          format: date-time

    CourseResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        instructorId:
          type: string
          format: uuid
        instructorName:
          type: string
        category:
          type: string
        level:
          type: string
          enum: [Beginner, Intermediate, Advanced]
        language:
          type: string
        price:
          type: number
          format: double
        discountPrice:
          type: number
          format: double
        thumbnail:
          type: string
          format: uri
        rating:
          type: number
          format: double
        reviewCount:
          type: integer
        enrollmentCount:
          type: integer
        duration:
          type: string
        createdAt:
          type: string
          format: date-time

    EnrollmentRequest:
      type: object
      required:
        - courseId
      properties:
        courseId:
          type: integer

    EnrollmentResponse:
      type: object
      properties:
        enrollmentId:
          type: string
        courseId:
          type: integer
        userId:
          type: string
          format: uuid
        enrolledAt:
          type: string
          format: date-time
        status:
          type: string
        progress:
          type: integer

    CartResponse:
      type: object
      properties:
        cartId:
          type: string
        userId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: number
          format: double
        discount:
          type: number
          format: double
        total:
          type: number
          format: double

    CartItem:
      type: object
      properties:
        itemId:
          type: string
        courseId:
          type: integer
        title:
          type: string
        thumbnail:
          type: string
          format: uri
        instructorName:
          type: string
        price:
          type: number
          format: double
        discountPrice:
          type: number
          format: double
        addedAt:
          type: string
          format: date-time

    AddToCartRequest:
      type: object
      required:
        - courseId
      properties:
        courseId:
          type: integer

    CreateOrderRequest:
      type: object
      properties:
        couponCode:
          type: string

    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
        userId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          type: number
          format: double
        discount:
          type: number
          format: double
        total:
          type: number
          format: double
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    OrderItem:
      type: object
      properties:
        courseId:
          type: integer
        title:
          type: string
        price:
          type: number
          format: double
        discountPrice:
          type: number
          format: double

    PaymentInitRequest:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: string
        paymentMethod:
          type: string
          enum: [PAYU]

    PaymentInitResponse:
      type: object
      properties:
        paymentId:
          type: string
        orderId:
          type: string
        amount:
          type: number
          format: double
        paymentUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    ReviewRequest:
      type: object
      required:
        - courseId
        - rating
      properties:
        courseId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    ReviewResponse:
      type: object
      properties:
        reviewId:
          type: string
        courseId:
          type: integer
        userId:
          type: string
          format: uuid
        userName:
          type: string
        rating:
          type: integer
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    WishlistResponse:
      type: object
      properties:
        wishlistId:
          type: string
        courseId:
          type: integer
        title:
          type: string
        thumbnail:
          type: string
          format: uri
        instructorName:
          type: string
        price:
          type: number
          format: double
        discountPrice:
          type: number
          format: double
        addedAt:
          type: string
          format: date-time

    AddToWishlistRequest:
      type: object
      required:
        - courseId
      properties:
        courseId:
          type: integer

    Error:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true
        timestamp:
          type: string
          format: date-time

paths:
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Register a new user account and send OTP to email for verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                profilePhoto:
                  type: string
                  format: binary
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                          status:
                            type: string
                          role:
                            type: string
                          otpSessionId:
                            type: string
                          expiresInSeconds:
                            type: integer
        '400':
          description: Bad request - validation error or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify email with OTP
      description: Verify email using OTP and issue JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Email verified successfully, tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request - invalid OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - account suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Locked - too many failed attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Locked - account locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Get new access token using refresh token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Unauthorized - invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Invalidate current session and blacklist tokens
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/me:
    get:
      tags:
        - User Profile
      summary: Get user profile
      description: Get current user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile fetched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - account suspended or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - User Profile
      summary: Update user profile
      description: Update current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/me/sessions:
    get:
      tags:
        - Sessions
      summary: List sessions
      description: List all active sessions for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessions fetched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SessionDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Sessions
      summary: Logout all sessions
      description: Logout from all devices/sessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out from all sessions successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/courses:
    get:
      tags:
        - Courses
      summary: Get course catalog
      description: Get paginated list of courses with filtering
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: category
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [Beginner, Intermediate, Advanced]
        - name: language
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [title, price, rating, createdAt]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Courses fetched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/CourseResponse'
                          totalElements:
                            type: integer
                          totalPages:
                            type: integer
                          number:
                            type: integer
                          size:
                            type: integer
                          first:
                            type: boolean
                          last:
                            type: boolean

  /api/v1/courses/{id}:
    get:
      tags:
        - Courses
      summary: Get course details
      description: Get course details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Course fetched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CourseResponse'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/enrollments:
    post:
      tags:
        - Enrollments
      summary: Enroll in course
      description: Enroll user in a course
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          description: Enrolled successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EnrollmentResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - not a student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - already enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/enrollments/my-courses:
    get:
      tags:
        - Enrollments
      summary: Get my courses
      description: Get all enrolled courses for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enrolled courses fetched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CourseResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/cart:
    get:
      tags:
        - Cart
      summary: Get cart
      description: Get user's shopping cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart fetched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CartResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Cart
      summary: Add to cart
      description: Add course to cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '201':
          description: Course added to cart
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CartResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - already in cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Cart
      summary: Clear cart
      description: Clear entire cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orders:
    post:
      tags:
        - Orders
      summary: Create order
      description: Create order from cart
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                allOf:
