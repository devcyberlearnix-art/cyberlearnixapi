plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {

    // ✅ Spring Boot Starter Web (REST APIs)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // ✅ Spring Data JPA (Hibernate)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // ✅ PostgreSQL Driver
    runtimeOnly 'org.postgresql:postgresql'

    // ✅ Validation (DTO validation like @NotNull)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ✅ Lombok (reduce boilerplate code)
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // ✅ Spring Security (optional, but recommended)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Commonlibs for shared JWT validator
    implementation project(':commonlibs')

    // Google Drive API v3
    implementation 'com.google.api-client:google-api-client:2.7.2'
    implementation 'com.google.oauth-client:google-oauth-client:1.36.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20241027-2.0.0'
    implementation 'com.google.http-client:google-http-client-jackson2:1.45.3'

    // SpringDoc OpenAPI
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // DevTools (auto restart during development)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
tasks.named('test') {
	useJUnitPlatform()
}
