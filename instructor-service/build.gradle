plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {

    // ✅ Spring Boot Starter Web (REST APIs)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // ✅ Spring Data JPA (Hibernate)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // ✅ PostgreSQL Driver
    runtimeOnly 'org.postgresql:postgresql'

    // ✅ Validation (DTO validation like @NotNull)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ✅ Lombok (reduce boilerplate code)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ✅ Spring Security (optional, but recommended)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // ✅ JWT (if you're using authentication)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Commonlibs for shared JWT validator
    implementation project(':commonlibs')

    // Cloudinary SDK
    implementation 'com.cloudinary:cloudinary-http5:2.3.2'

    // ✅ DevTools (auto restart during development)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // ✅ Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
tasks.named('test') {
	useJUnitPlatform()
}
