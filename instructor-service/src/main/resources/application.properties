# ===============================
# APPLICATION NAME
# ===============================
spring.application.name=instructorservice

# ===============================
# SERVER CONFIG
# ===============================
server.port=8088

# ===============================
# DATABASE (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:lms_instructor_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cyberlearnix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cyberlearnix123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
logging.level.org.springframework=DEBUG
spring.jackson.default-property-inclusion=non_null

# SQL Data Initialization
spring.sql.init.mode=never
# ===============================
# HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# ===============================
# LOGGING (DEBUG SQL)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# JWT CONFIG (IMPORTANT)
# ===============================
jwt.secret=${JWT_SECRET:8c4e9d2f1a7b6c5d9e3f0a1b7c8d4e5f9a2b6c1d8e7f3a4b5c9d1e6f8a2b7c3}
jwt.issuer=${JWT_ISSUER:cyberlearnix}
jwt.audience=${JWT_AUDIENCE:cyberlearnix-clients}
jwt.expiration=86400000

# ===============================
# SPRING SECURITY (OPTIONAL - REMOVE IN PRODUCTION)
# ===============================
spring.security.user.name=admin
spring.security.user.password=admin123

# ===============================
# FILE UPLOAD (OPTIONAL)
# ===============================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===============================
# JACKSON TIMEZONE
# ===============================
spring.jackson.time-zone=Asia/Kolkata

# ==============================================================================
# Google Drive Configuration (MANDATORY - Strict Single Predefined Folder Rule)
# ==============================================================================
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.refresh-token=${GOOGLE_REFRESH_TOKEN}
google.folder-id=${GOOGLE_FOLDER_ID:1nLiT67PMJLS_fDw4M_jJ_qOdA0qenQYJ}
