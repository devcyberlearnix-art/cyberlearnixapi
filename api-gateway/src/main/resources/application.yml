server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: false

  codec:
    max-in-memory-size: 30MB

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true

  cloud:
    gateway:
      # Completely disable any auto-configuration of CORS
      globalcors:
        enabled: false

      # Disabled: CORS is now handled by CorsWebFilter bean in CorsConfig.java
      # The globalcors configuration in YAML doesn't work reliably with Spring Cloud Gateway 4.x
      # Using programmatic CorsWebFilter instead
      # globalcors:
      #   cors-configurations:
      #     '[/**]':
      #       allowedOriginPatterns:
      #         - "http://localhost:*"
      #         - "http://127.0.0.1:*"
      #         - "https://*.ngrok-free.app"
      #         - "https://*.ngrok-free.dev"
      #         - "https://*.ngrok.io"
      #       allowedMethods:
      #         - GET
      #         - POST
      #         - PUT
      #         - PATCH
      #         - DELETE
      #         - OPTIONS
      #       allowedHeaders:
      #         - "*"
      #       allowCredentials: true
      #       maxAge: 3600
      # default-filters:
      #   - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      httpclient:
        max-header-size: 16KB
        max-initial-line-length: 8KB
        response-timeout: 120s
        connect-timeout: 10000
        pool:
          type: elastic
          max-connections: 1000
          max-idle-time: 30s
          max-life-time: 60s
          eviction-interval: 10s

      routes:
        # ── Course Service - Admin Banners ────────────────────────
        # Banner admin operations should go to course service, not admin service
        # This route must come before the general admin service route
        - id: courseservice-banners-admin
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/admin/banners/**
          filters:
            - StripPrefix=0

        # ── Course Service - Public Banners ───────────────────────
        - id: courseservice-banners-public
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/banners/**
          filters:
            - StripPrefix=0

        # ── Review Service - Admin Reviews ───────────────────────
        - id: reviewservice-admin
          uri: ${REVIEWSERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/admin/reviews/**
          filters:
            - StripPrefix=0

        # ── Notification Service - Admin Broadcast & DLQ ─────────
        - id: notificationservice-admin
          uri: ${NOTIFICATIONSERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/admin/broadcast,/api/v1/admin/reprocess-dlq
          filters:
            - StripPrefix=0

        # ── Admin Service ─────────────────────────────────────────
        - id: adminservice
          uri: ${ADMIN_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - StripPrefix=0

        # ── User Service ────────────────────────────────────────
        - id: userservice-auth
          uri: ${USER_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # ── User Service OAuth2 ─────────────────────────────────
        - id: userservice-oauth
          uri: ${USER_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/oauth2/**,/login/oauth2/**
          filters:
            - StripPrefix=0

        # ── Common OTP Resend ───────────────────────────────────
        # Explicit route for common OTP resend to ensure proper routing
        - id: userservice-otp-resend
          uri: ${USER_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/auth/otp/resend
          filters:
            - StripPrefix=0

        - id: userservice-sessions
          uri: ${USER_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/users/me/sessions/**
          filters:
            - StripPrefix=0

        # ── Notification Service - User Notifications ────────────
        - id: notificationservice-user-notifications
          uri: ${NOTIFICATIONSERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/users/me/notifications,/api/v1/users/me/unread,/api/v1/users/me/read/**,/api/v1/users/me/read-all,/api/v1/users/me/count
          filters:
            - StripPrefix=0

        - id: userservice-users
          uri: ${USER_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0

        # ── Course Service ──────────────────────────────────────
        - id: courseservice-courses
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/courses/**
          filters:
            - StripPrefix=0

        - id: courseservice-upload
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/upload/**
          filters:
            - StripPrefix=0

        - id: courseservice-enrollments
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/enrollments/**
          filters:
            - StripPrefix=0

        - id: courseservice-dashboard
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/dashboard/**
          filters:
            - StripPrefix=0

        - id: courseservice-sections
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/sections/**
          filters:
            - StripPrefix=0

        # ── Notification Service - Assignment Reminder & Certificate Notify ─
        - id: notificationservice-assignments-reminder
          uri: ${NOTIFICATIONSERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/assignments/reminder
          filters:
            - StripPrefix=0

        - id: notificationservice-certificates-notify
          uri: ${NOTIFICATIONSERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/certificates/notify
          filters:
            - StripPrefix=0

        - id: courseservice-assignments
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/assignments/**
          filters:
            - StripPrefix=0

        - id: courseservice-quizzes
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/quizzes/**
          filters:
            - StripPrefix=0

        - id: courseservice-live-classes
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/live-classes/**
          filters:
            - StripPrefix=0

        - id: courseservice-progress
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/progress/**
          filters:
            - StripPrefix=0

        - id: courseservice-certificates
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/certificates/**
          filters:
            - StripPrefix=0

        # ── Cart Service ────────────────────────────────────────
        - id: cartservice
          uri: ${CARTSERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/cart/**
          filters:
            - StripPrefix=0

        # ── Coupon Service ──────────────────────────────────────
        - id: couponservice
          uri: ${COUPONSERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/coupons/**
          filters:
            - StripPrefix=0

        # ── Wishlist Service ──────────────────────────────────────
        - id: wishlistservice
          uri: ${WISHLISTSERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/v1/wishlist/**
          filters:
            - StripPrefix=0

        # ── Order Service ─────────────────────────────────────────
        - id: orderservice
          uri: ${ORDERSERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0

        # ── Payment Service ───────────────────────────────────────
        - id: paymentservice
          uri: ${PAYMENTSERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=0

        - id: paymentservice-test
          uri: ${PAYMENTSERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/test/**
          filters:
            - StripPrefix=0

        # ── User Service - Instructor Applications ─────────────────
        # Instructor application endpoints (submit application, check status)
        # Must come before instructor service catch-all route
        - id: userservice-instructors-applications
          uri: ${USER_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/instructors/applications/**
          filters:
            - StripPrefix=0

        # ── User Service - Instructor Profile ────────────────────
        - id: userservice-instructors-profile
          uri: ${USER_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/instructors/*/profile,/api/v1/instructors/{instructorId}/profile
          filters:
            - StripPrefix=0

        # ── Instructor Service ────────────────────────────────────
        # Specific instructor endpoints must come before the general /api/v1/instructors/** route
        - id: instructorservice-specific
          uri: ${INSTRUCTOR_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/instructors/{id}/courses,/api/v1/instructors/{id}/courses/**,/api/v1/instructors/{id}/dashboard,/api/v1/instructors/{id}/earnings,/api/v1/instructors/{id}/content/**,/api/v1/instructors/{instructorId}/courses/{courseId}/modules/**,/api/v1/instructors/{id}/courses/{courseId}/messages,/api/v1/instructors/me
          filters:
            - StripPrefix=0

        # ── Review Service ──────────────────────────────────────────
        - id: reviewservice
          uri: ${REVIEWSERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/reviews/**
          filters:
            - StripPrefix=0

        # ── Notification Service ────────────────────────────────────
        - id: notificationservice
          uri: ${NOTIFICATIONSERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0

        - id: notificationservice-system
          uri: ${NOTIFICATIONSERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/system/**
          filters:
            - StripPrefix=0

        - id: notificationservice-templates
          uri: ${NOTIFICATIONSERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/templates/**
          filters:
            - StripPrefix=0

        - id: notificationservice-preferences
          uri: ${NOTIFICATIONSERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/preferences/**
          filters:
            - StripPrefix=0

        # ── Security Verification (email CTA links) ─────────────────
        - id: notificationservice-security
          uri: ${NOTIFICATIONSERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/security/**
          filters:
            - StripPrefix=0

        # ── Device Tokens (Push Notifications) ──────────────────────
        - id: notificationservice-devicetokens
          uri: ${NOTIFICATIONSERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/device-tokens,/api/v1/device-tokens/**
          filters:
            - StripPrefix=0

        # ── Push Notifications ─────────────────────────────────────
        - id: notificationservice-push
          uri: ${NOTIFICATIONSERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/push,/api/v1/push/**
          filters:
            - StripPrefix=0

        # ── Live Class Reminders ───────────────────────────────────
        - id: notificationservice-liveclass
          uri: ${NOTIFICATIONSERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/live-class/**
          filters:
            - StripPrefix=0

        # ── Swagger Routes ──────────────────────────
        - id: userservice-swagger-ui
          uri: ${USER_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/userservice/swagger-ui/**
          filters:
            - RewritePath=/userservice/swagger-ui/(?<segment>.*), /swagger-ui/${segment}

        - id: userservice-api-docs
          uri: ${USER_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/userservice/v3/api-docs/**
          filters:
            - RewritePath=/userservice/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}

        - id: courseservice-swagger-ui
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/courseservice/swagger-ui/**
          filters:
            - RewritePath=/courseservice/swagger-ui/(?<segment>.*), /swagger-ui/${segment}

        - id: courseservice-api-docs
          uri: ${COURSESERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/courseservice/v3/api-docs/**
          filters:
            - RewritePath=/courseservice/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}

        # Gateway Swagger
        - id: apigateway-swagger-ui-html
          uri: no://op
          predicates:
            - Path=/swagger-ui.html

        - id: apigateway-swagger-ui
          uri: no://op
          predicates:
            - Path=/swagger-ui/**

        - id: apigateway-api-docs
          uri: no://op
          predicates:
            - Path=/v3/api-docs/**

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: 2000ms

jwt:
  issuer: cyberlearnix
  audience: cyberlearnix-clients
  access-token:
    secret: ${JWT_ACCESS_TOKEN_SECRET:8c4e9d2f1a7b6c5d9e3f0a1b7c8d4e5f9a2b6c1d8e7f3a4b5c9d1e6f8a2b7c3}
    expiration-minutes: 15
  refresh-token:
    secret: ${JWT_REFRESH_TOKEN_SECRET:8c4e9d2f1a7b6c5d9e3f0a1b7c8d4e5f9a2b6c1d8e7f3a4b5c9d1e6f8a2b7c3}
    expiration-days: 30

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
  allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With,ngrok-skip-browser-warning}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max-age: ${CORS_MAX_AGE:3600}

# Rate Limiting Configuration
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:100}
  whitelist-ips: ${RATE_LIMIT_WHITELIST_IPS:}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    gateway:
      enabled: true
