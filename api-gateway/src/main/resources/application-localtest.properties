# Localtest profile for API Gateway
spring.profiles.active=localtest

# JWT secrets should match user-service localtest for local development
jwt.access-token.secret=${JWT_ACCESS_TOKEN_SECRET:localTestSecretKeyThatIsAtLeast32CharactersLong}
jwt.refresh-token.secret=${JWT_REFRESH_TOKEN_SECRET:localTestRefreshSecretKeyThatIsAtLeast32CharactersLong}
jwt.issuer=${JWT_ISSUER:cyberlearnix}
jwt.audience=${JWT_AUDIENCE:cyberlearnix-clients}
