server:



  port: 8080







spring:



  cloud:



    gateway:



      globalcors:



        corsConfigurations:



          '[/**]':



            allowedOriginPatterns:



              - "http://localhost:*"



              - "http://127.0.0.1:*"



              - "https://*.ngrok-free.dev"



              - "https://*.ngrok.io"



            allowedMethods:



              - GET



              - POST



              - PUT



              - DELETE



              - OPTIONS



              - PATCH



            allowedHeaders:



              - Authorization



              - Content-Type



              - X-Requested-With



              - Accept



              - Origin



              - Access-Control-Request-Method



              - Access-Control-Request-Headers



            allowCredentials: true



            exposedHeaders:



              - Authorization



              - X-Total-Count



      routes:



        # ── User Service (8086) ──────────────────────────



        - id: userservice



          uri: http://localhost:8091



          predicates:



            - Path=/api/v1/auth/register, /api/v1/auth/verify-email, /api/v1/auth/login, /api/v1/auth/login/otp/**, /api/v1/auth/refresh, /api/v1/auth/logout, /api/v1/auth/password/**, /api/v1/auth/switch-role, /api/v1/auth/upload/profile-photo



        - id: userservice-sessions



          uri: http://localhost:8091



          predicates:



            - Path=/api/v1/sessions/**



        - id: userservice-users



          uri: http://localhost:8091



          predicates:



            - Path=/api/v1/users/**



        - id: userservice-profile



          uri: http://localhost:8091



          predicates:



            - Path=/api/v1/profile/**



          filters:



            - PreserveHostHeader



        - id: userservice-instructors



          uri: http://localhost:8091



          predicates:



            - Path=/api/v1/instructors/apply/**







        # ── Course Service (8083) ────────────────────────



        - id: courseservice-courses



          uri: http://localhost:8083



          predicates:



            - Path=/api/v1/courses/**



        - id: courseservice-api-courses



          uri: http://localhost:8083



          predicates:



            - Path=/api/courses/**



          filters:



            - RewritePath=/api/courses/(?<segment>.*), /api/v1/courses/${segment}



        - id: courseservice-enrollments



          uri: http://localhost:8083



          predicates:



            - Path=/api/v1/enrollments/**



        - id: courseservice-sections



          uri: http://localhost:8083



          predicates:



            - Path=/api/v1/sections/**







        # ── Cart Service (8081) ──────────────────────────



        - id: cartservice



          uri: http://localhost:8081



          predicates:



            - Path=/api/v1/cart/**







        # ── Coupon Service (8082) ────────────────────────



        - id: couponservice



          uri: http://localhost:8082



          predicates:



            - Path=/api/v1/coupons/**







        # ── Wishlist Service (8090) ──────────────────────



        - id: wishlistservice



          uri: http://localhost:8090



          predicates:



            - Path=/api/v1/wishlist, /api/v1/wishlist/**



          filters:



            - RewritePath=/api/v1/wishlist(?<segment>/?.*), /api/v1/wishlist${segment}



        - id: wishlistservice-direct



          uri: http://localhost:8090



          predicates:



            - Path=/api/v1/wishlist/**







        # ── Order Service (8084) ─────────────────────────



        - id: orderservice



          uri: http://localhost:8084



          predicates:



            - Path=/api/v1/orders/**







        # ── Payment Service (8085) ────────────────────────



        - id: paymentservice



          uri: http://localhost:8085



          predicates:



            - Path=/api/v1/payments/**, /api/payments/**, /api/payment/**



          filters:



            - RewritePath=/api/payment/(?<segment>.*), /api/v1/payments/${segment}



            - RewritePath=/api/payments/(?<segment>.*), /api/v1/payments/${segment}







        # ── Notification Service (8093) ────────────────────



        - id: notificationservice



          uri: http://localhost:8093



          predicates:



            - Path=/api/v1/notifications/**



        - id: notificationservice-direct



          uri: http://localhost:8093



          predicates:



            - Path=/api/v1/notifications/**







        # ── Admin Service (8087) ─────────────────────────



        - id: adminservice



          uri: http://localhost:8087



          predicates:



            - Path=/api/v1/admin/**







        # ── Instructor Service (8088) ────────────────────



        - id: instructorservice



          uri: http://localhost:8088



          predicates:



            - Path=/api/v1/instructors/**







        # ── Review Service (8089) ────────────────────────



        - id: reviewservice



          uri: http://localhost:8089



          predicates:



            - Path=/api/v1/reviews/**







        - id: reviewservice-admin



          uri: http://localhost:8089



          predicates:



            - Path=/api/v1/admin/reviews/**











        # ── Swagger / API Docs ──────────────────────────



        - id: userservice-swagger-ui



          uri: http://localhost:8091



          predicates:



            - Path=/userservice/swagger-ui/**



          filters:



            - RewritePath=/userservice/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}



        - id: userservice-api-docs



          uri: http://localhost:8091



          predicates:



            - Path=/userservice/v3/api-docs/**



          filters:



            - RewritePath=/userservice/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}







        - id: courseservice-swagger-ui



          uri: http://localhost:8083



          predicates:



            - Path=/courseservice/swagger-ui/**



          filters:



            - RewritePath=/courseservice/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}



        - id: courseservice-api-docs



          uri: http://localhost:8083



          predicates:



            - Path=/courseservice/v3/api-docs/**



          filters:



            - RewritePath=/courseservice/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}







        - id: cartservice-swagger-ui



          uri: http://localhost:8081



          predicates:



            - Path=/cartservice/swagger-ui/**



          filters:



            - RewritePath=/cartservice/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}



        - id: cartservice-api-docs



          uri: http://localhost:8081



          predicates:



            - Path=/cartservice/v3/api-docs/**



          filters:



            - RewritePath=/cartservice/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}







        - id: couponservice-swagger-ui



          uri: http://localhost:8082



          predicates:



            - Path=/couponservice/swagger-ui/**



          filters:



            - RewritePath=/couponservice/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}



        - id: couponservice-api-docs



          uri: http://localhost:8082



          predicates:



            - Path=/couponservice/v3/api-docs/**



          filters:



            - RewritePath=/couponservice/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}







        - id: wishlistservice-swagger-ui



          uri: http://localhost:8090



          predicates:



            - Path=/wishlistservice/swagger-ui/**



          filters:



            - RewritePath=/wishlistservice/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}



        - id: wishlistservice-api-docs



          uri: http://localhost:8090



          predicates:



            - Path=/wishlistservice/v3/api-docs/**



          filters:



            - RewritePath=/wishlistservice/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}







logging:



  level:



    com.swachvega: DEBUG



    org.springframework.cloud.gateway: DEBUG



    org.springframework.security: DEBUG



