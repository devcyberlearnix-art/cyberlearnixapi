# Production JWT Configuration
jwt:
  access-token:
    secret: ${JWT_ACCESS_TOKEN_SECRET:myVerySecretKeyForAccessTokenThatIsAtLeast32CharactersLongForHS256Algorithm}
    expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  refresh-token:
    secret: ${JWT_REFRESH_TOKEN_SECRET:myVerySecretKeyForRefreshTokenThatIsAtLeast32CharactersLongForHS256Algorithm}
    expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}

# Security Configuration
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://yourdomain.com}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
    requests-per-minute: ${RATE_LIMITING_REQUESTS_PER_MINUTE:100}

# Logging Configuration
logging:
  level:
    com.swachvega: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.springframework.web: ${WEB_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:./logs/apigateway.log}
    max-size: ${LOG_FILE_MAX_SIZE:10MB}
    max-history: ${LOG_FILE_MAX_HISTORY:30}

# Service URLs
userservice:
  url: ${USERSERVICE_URL:http://userservice:8080}
  timeout: ${USERSERVICE_TIMEOUT:30s}
  
productservice:
  url: ${PRODUCTSERVICE_URL:http://productservice:8080}
  timeout: ${PRODUCTSERVICE_TIMEOUT:30s}
  
orderservice:
  url: ${ORDERSERVICE_URL:http://orderservice:8080}
  timeout: ${ORDERSERVICE_TIMEOUT:30s}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  
# Spring Cloud Gateway Configuration
spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:10000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:30000}
        pool:
          max-idle-time: ${GATEWAY_POOL_MAX_IDLE_TIME:30s}
          max-life-time: ${GATEWAY_POOL_MAX_LIFE_TIME:60s}
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://yourdomain.com}
            allowedMethods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
            allowedHeaders: ${CORS_ALLOWED_HEADERS:*}
            allowCredentials: ${CORS_ALLOW_CREDENTIALS:true}
            maxAge: ${CORS_MAX_AGE:3600}

# Management and Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
  info:
    env:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true
