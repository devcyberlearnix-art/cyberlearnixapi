server:
  port: 8080

spring:
  cloud:
    gateway:
      httpclient:
        max-header-size: 16KB
        max-initial-line-length: 8KB
      routes:
        # chatservice aliases for LOCAL runs (gateway on 8080 -> chatservice on 8090)
        - id: chatservice-token-local
          uri: http://localhost:8090
          predicates:
            - Path=/token
          filters:
            - StripPrefix=0

        - id: chatservice-create-conv-local
          uri: http://localhost:8090
          predicates:
            - Path=/create-conversation
          filters:
            - StripPrefix=0

        - id: chatservice-active-convs-local
          uri: http://localhost:8090
          predicates:
            - Path=/active-conversations
          filters:
            - StripPrefix=0

        - id: chatservice-end-conv-local
          uri: http://localhost:8090
          predicates:
            - Path=/end-conversation
          filters:
            - StripPrefix=0

        - id: chatservice-support-live-request-local
          uri: http://localhost:8090
          predicates:
            - Path=/support/live-request
          filters:
            - StripPrefix=0

        - id: chatservice-conversations-local
          uri: http://localhost:8090
          predicates:
            - Path=/conversations, /conversations/**
          filters:
            - StripPrefix=0

        - id: chatservice-ws-local
          uri: ws://localhost:8090
          predicates:
            - Path=/ws
          filters:
            - StripPrefix=0

        - id: chatservice-agents-local
          uri: http://localhost:8090
          predicates:
            - Path=/agents, /agents/**
          filters:
            - StripPrefix=0

        - id: userservice
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: authservice
          uri: http://localhost:8081
          predicates:
            - Path=/api/consumer/auth/**
        - id: couponservice
          uri: http://localhost:8090
          predicates:
            - Path=/api/merchant/coupons/**

        # Admin coupon APIs should go directly to couponservice, not adminservice
        - id: couponservice-admin
          uri: http://localhost:8090
          predicates:
            - Path=/api/admin/coupons/**
        
        # Merchant global search - must be BEFORE general merchantservice route
        - id: merchant-global-search
          uri: http://localhost:8085
          predicates:
            - Path=/api/merchant/global-search/**
        
        - id: merchantservice
          uri: http://localhost:8089
          predicates:
            - Path=/api/merchant/**

        - id: restaurantservice
          uri: http://localhost:8096
          predicates:
            - Path=/api/restaurant/**
        - id: productservice
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**
        - id: productservice-v1
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**
        - id: categoryservice
          uri: http://localhost:8082
          predicates:
            - Path=/api/categories/**
        - id: productservice-subcategories
          uri: http://localhost:8082
          predicates:
            - Path=/api/subcategories/**
        - id: productservice-subsubcategories
          uri: http://localhost:8082
          predicates:
            - Path=/api/subsubcategories/**
        - id: ratingfavoriteservice
          uri: http://localhost:8092
          predicates:
            - Path=/api/orders/ratings, /api/orders/ratings/**, /api/orders/favorites, /api/orders/favorites/**, /api/orders/consumer/ratings, /api/orders/consumer/ratings/**, /api/orders/*/ratings, /api/orders/*/ratings/**,/api/consumer/favorites/**
        - id: orderservice
          uri: http://localhost:8086
          predicates:
            - Path=/api/orders/**, /api/trends/**
        - id: orderservice-consumer-coupons
          uri: http://localhost:8086
          predicates:
            - Path=/api/consumer/coupons/**
        # Payment endpoints handled by orderservice (PayUController)
        - id: paymentservice
          uri: http://localhost:8086
          predicates:
            - Path=/api/payment/**
        - id: inventoryservice
          uri: http://localhost:8084
          predicates:
            - Path=/api/inventory/**
        - id: searchservice
          uri: http://localhost:8085
          predicates:
            - Path=/api/search/**
        - id: storeservice
          uri: http://localhost:8083
          predicates:
            - Path=/api/stores/**
        - id: landingpageservice
          uri: http://localhost:8087
          predicates:
            - Path=/api/home/**
        - id: cartservice
          uri: http://localhost:8088
          predicates:
            - Path=/api/cart/**
        - id: adminservice
          uri: http://localhost:8091
          predicates:
            - Path=/api/admin/**

        - id: analytics
          uri: http://localhost:8091
          predicates:
            - Path=/api/analytics/**
        - id: notificationservice
          uri: http://localhost:8095
          predicates:
            - Path=/api/notifications/**
            
        # Swagger UI and API Docs routing
        - id: userservice-swagger-ui
          uri: http://localhost:8081
          predicates:
            - Path=/userservice/swagger-ui/**
          filters:
            - RewritePath=/userservice/swagger-ui/(?<segment>.*), /swagger-ui/${segment}
        - id: userservice-api-docs
          uri: http://localhost:8081
          predicates:
            - Path=/userservice/v3/api-docs/**
          filters:
            - RewritePath=/userservice/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}
            
        - id: productservice-swagger-ui
          uri: http://localhost:8082
          predicates:
            - Path=/productservice/swagger-ui/**
          filters:
            - RewritePath=/productservice/swagger-ui/(?<segment>.*), /swagger-ui/${segment}
        - id: productservice-api-docs
          uri: http://localhost:8082
          predicates:
            - Path=/productservice/v3/api-docs/**
          filters:
            - RewritePath=/productservice/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}
            
        - id: orderservice-swagger-ui
          uri: http://localhost:8086
          predicates:
            - Path=/orderservice/swagger-ui/**
          filters:
            - RewritePath=/orderservice/swagger-ui/(?<segment>.*), /swagger-ui/${segment}
        - id: orderservice-api-docs
          uri: http://localhost:8086
          predicates:
            - Path=/orderservice/v3/api-docs/**
          filters:
            - RewritePath=/orderservice/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}
            
        - id: inventoryservice-swagger-ui
          uri: http://localhost:8084
          predicates:
            - Path=/inventoryservice/swagger-ui/**
          filters:
            - RewritePath=/inventoryservice/swagger-ui/(?<segment>.*), /swagger-ui/${segment}
        - id: inventoryservice-api-docs
          uri: http://localhost:8084
          predicates:
            - Path=/inventoryservice/v3/api-docs/**
          filters:
            - RewritePath=/inventoryservice/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}
            
        - id: searchservice-swagger-ui
          uri: http://localhost:8085
          predicates:
            - Path=/searchservice/swagger-ui/**
          filters:
            - RewritePath=/searchservice/swagger-ui/(?<segment>.*), /swagger-ui/${segment}
        - id: searchservice-api-docs
          uri: http://localhost:8085
          predicates:
            - Path=/searchservice/v3/api-docs/**
          filters:
            - RewritePath=/searchservice/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}
            
        - id: storeservice-swagger-ui
          uri: http://localhost:8083
          predicates:
            - Path=/storeservice/swagger-ui/**
          filters:
            - RewritePath=/storeservice/swagger-ui/(?<segment>.*), /swagger-ui/${segment}
        - id: storeservice-api-docs
          uri: http://localhost:8083
          predicates:
            - Path=/storeservice/v3/api-docs/**
          filters:
            - RewritePath=/storeservice/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}
        - id: adminservice-api-docs
          uri: http://localhost:8091
          predicates:
            - Path=/adminservice/v3/api-docs/**
          filters:
            - RewritePath=/adminservice/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}
        
        - id: notificationservice-swagger-ui
          uri: http://localhost:8095
          predicates:
            - Path=/notificationservice/swagger-ui/**
          filters:
            - RewritePath=/notificationservice/swagger-ui/(?<segment>.*), /swagger-ui/${segment}
        - id: notificationservice-api-docs
          uri: http://localhost:8095
          predicates:
            - Path=/notificationservice/v3/api-docs/**
          filters:
            - RewritePath=/notificationservice/v3/api-docs/(?<segment>.*), /v3/api-docs/${segment}
            
        # Main API Gateway Swagger UI (aggregated view)
        - id: apigateway-swagger-ui-html
          uri: no://op
          predicates:
            - Path=/swagger-ui.html
        - id: apigateway-swagger-ui
          uri: no://op
          predicates:
            - Path=/swagger-ui/**
        - id: apigateway-api-docs
          uri: no://op
          predicates:
            - Path=/v3/api-docs/**

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# JWT Configuration
jwt:
  access-token:
    secret: ${JWT_ACCESS_SECRET:myVerySecretKeyForAccessTokenThatIsAtLeast32CharactersLongForHS256Algorithm}
    expiration-minutes: 15
  refresh-token:
    secret: ${JWT_REFRESH_SECRET:myVerySecretKeyForRefreshTokenThatIsAtLeast32CharactersLongForHS256Algorithm}
    expiration-days: 30

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
      roles: ["ACTUATOR"]
      group:
        readiness:
          include: readinessState,redis,diskSpace
          show-details: always
        liveness:
          include: livenessState,diskSpace,ping
          show-details: always
        detailed:
          include: "*"
          show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
    info:
      enabled: true
    env:
      enabled: true
      show-values: always
  health:
    defaults:
      enabled: true
    redis:
      enabled: true
      timeout: 5s
    diskspace:
      enabled: true
      threshold: 100MB
    ping:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    git:
      mode: full
    build:
      enabled: true

# User Service Configuration
userservice:
  url: ${USER_SERVICE_URL:http://localhost:8081}

# Security Configuration
security:
  rate-limit:
    login-attempts: 5
    login-window-minutes: 15
    refresh-requests: 10
    refresh-window-minutes: 1
  session:
    max-concurrent-sessions: 5
    cleanup-interval-seconds: 3600

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: API Gateway
      - url: /userservice/v3/api-docs
        name: User Service (Auth)
      - url: /productservice/v3/api-docs
        name: Product Service
      - url: /orderservice/v3/api-docs
        name: Order Service
      - url: /inventoryservice/v3/api-docs
        name: Inventory Service
      - url: /searchservice/v3/api-docs
        name: Search Service
      - url: /storeservice/v3/api-docs
        name: Store Service
      - url: /adminservice/v3/api-docs
        name: Admin Service
      - url: /notificationservice/v3/api-docs
        name: Notification Service

# Enable debug logging for troubleshooting
logging:
  level:
    root: INFO
    com.swachvega.apigateway: DEBUG
    org.springframework.cloud.gateway: DEBUG