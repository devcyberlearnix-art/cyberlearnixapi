version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: swachvega-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swachvegadb}
      POSTGRES_USER: ${POSTGRES_USER:-swachvega}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swachvega123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: swachvega-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: swachvega-redisinsight
    ports:
      - "5540:5540"
    restart: unless-stopped

  userservice:
    image: swachvegaregistry.azurecr.io/userservice:latest
    container_name: swachvega-userservice
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-swachvegadb}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-swachvega}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-swachvega123}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # JWT Configuration
      - JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32CharactersLongForHS256Algorithm}
      - JWT_REFRESH_TOKEN_SECRET=${JWT_REFRESH_TOKEN_SECRET:-myVerySecretKeyForRefreshTokenThatIsAtLeast32CharactersLongForHS256Algorithm}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  apigateway:
    image: swachvegaregistry.azurecr.io/apigateway:latest
    container_name: swachvega-apigateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      # JWT Configuration
      - JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32CharactersLongForHS256Algorithm}
      - JWT_REFRESH_TOKEN_SECRET=${JWT_REFRESH_TOKEN_SECRET:-myVerySecretKeyForRefreshTokenThatIsAtLeast32CharactersLongForHS256Algorithm}
      - JWT_ACCESS_TOKEN_EXPIRATION_MINUTES=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      - JWT_REFRESH_TOKEN_EXPIRATION_DAYS=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-30}
      # Service URLs
      - USERSERVICE_URL=${USERSERVICE_URL:-http://userservice:8080}
    depends_on:
      - userservice
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
