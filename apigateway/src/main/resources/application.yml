server:
  port: 8080
  netty:
    connection-timeout: 20s
    max-keep-alive-requests: 10000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  codec:
    max-in-memory-size: 30MB
  cloud:
    gateway:
      httpclient:
        max-header-size: 16KB
        max-initial-line-length: 8KB
        response-timeout: 120s
        connect-timeout: 10000
        pool:
          type: elastic
          max-connections: 1000
          max-idle-time: 30s
          max-life-time: 60s
          eviction-interval: 10s
      routes:
        # ── User Service ────────────────────────────────────────
        - id: userservice-auth
          uri: ${USERSERVICE_URL:http://userservice:8086}
          predicates:
            - Path=/auth/**

        - id: userservice-users
          uri: ${USERSERVICE_URL:http://userservice:8086}
          predicates:
            - Path=/users/**

        - id: userservice-profile
          uri: ${USERSERVICE_URL:http://userservice:8086}
          predicates:
            - Path=/api/v1/profile/**

        - id: userservice-instructors
          uri: ${USERSERVICE_URL:http://userservice:8086}
          predicates:
            - Path=/instructors/**

        # ── Course Service ──────────────────────────────────────
        - id: courseservice-courses
          uri: ${COURSESERVICE_URL:http://course-service:8083}
          predicates:
            - Path=/courses/**

        - id: courseservice-sections
          uri: ${COURSESERVICE_URL:http://course-service:8083}
          predicates:
            - Path=/sections/**

        # ── Cart Service ────────────────────────────────────────
        - id: cartservice
          uri: ${CARTSERVICE_URL:http://cart-service:8081}
          predicates:
            - Path=/api/cart/**

        # ── Coupon Service ──────────────────────────────────────
        - id: couponservice
          uri: ${COUPONSERVICE_URL:http://coupon-service:8082}
          predicates:
            - Path=/api/coupons/**

        # ── Swagger / API Docs routing ──────────────────────────
        - id: userservice-swagger-ui
          uri: ${USERSERVICE_URL:http://userservice:8086}
          predicates:
            - Path=/userservice/swagger-ui/**
          filters:
            - RewritePath=/userservice/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        - id: userservice-api-docs
          uri: ${USERSERVICE_URL:http://userservice:8086}
          predicates:
            - Path=/userservice/v3/api-docs/**
          filters:
            - RewritePath=/userservice/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}

        - id: courseservice-swagger-ui
          uri: ${COURSESERVICE_URL:http://course-service:8083}
          predicates:
            - Path=/courseservice/swagger-ui/**
          filters:
            - RewritePath=/courseservice/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        - id: courseservice-api-docs
          uri: ${COURSESERVICE_URL:http://course-service:8083}
          predicates:
            - Path=/courseservice/v3/api-docs/**
          filters:
            - RewritePath=/courseservice/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}

        - id: cartservice-swagger-ui
          uri: ${CARTSERVICE_URL:http://cart-service:8081}
          predicates:
            - Path=/cartservice/swagger-ui/**
          filters:
            - RewritePath=/cartservice/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        - id: cartservice-api-docs
          uri: ${CARTSERVICE_URL:http://cart-service:8081}
          predicates:
            - Path=/cartservice/v3/api-docs/**
          filters:
            - RewritePath=/cartservice/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}

        - id: couponservice-swagger-ui
          uri: ${COUPONSERVICE_URL:http://coupon-service:8082}
          predicates:
            - Path=/couponservice/swagger-ui/**
          filters:
            - RewritePath=/couponservice/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        - id: couponservice-api-docs
          uri: ${COUPONSERVICE_URL:http://coupon-service:8082}
          predicates:
            - Path=/couponservice/v3/api-docs/**
          filters:
            - RewritePath=/couponservice/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}

        # Gateway's own Swagger UI (aggregated)
        - id: apigateway-swagger-ui-html
          uri: no://op
          predicates:
            - Path=/swagger-ui.html
        - id: apigateway-swagger-ui
          uri: no://op
          predicates:
            - Path=/swagger-ui/**
        - id: apigateway-api-docs
          uri: no://op
          predicates:
            - Path=/v3/api-docs/**

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# JWT – must match the secret used by userservice
jwt:
  issuer: ${JWT_ISSUER:cyberlearnix}
  audience: ${JWT_AUDIENCE:cyberlearnix-clients}
  access-token:
    secret: ${JWT_ACCESS_SECRET:myVerySecretKeyForAccessTokenThatIsAtLeast32CharactersLongForHS256Algorithm}
    expiration-minutes: 15
  refresh-token:
    secret: ${JWT_REFRESH_SECRET:myVerySecretKeyForRefreshTokenThatIsAtLeast32CharactersLongForHS256Algorithm}
    expiration-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# Service URLs
userservice:
  url: ${USERSERVICE_URL:http://userservice:8086}

security:
  rate-limit:
    login-attempts: 5
    login-window-minutes: 15

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs
        name: API Gateway
      - url: /userservice/v3/api-docs
        name: User Service
      - url: /courseservice/v3/api-docs
        name: Course Service
      - url: /cartservice/v3/api-docs
        name: Cart Service
      - url: /couponservice/v3/api-docs
        name: Coupon Service

logging:
  level:
    com.swachvega: INFO
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO