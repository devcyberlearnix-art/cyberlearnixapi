server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        # ── User Service (local: 8086) ──────────────────────────
        - id: userservice-auth
          uri: http://localhost:8086
          predicates:
            - Path=/auth/**

        - id: userservice-users
          uri: http://localhost:8086
          predicates:
            - Path=/users/**

        - id: userservice-profile
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/profile/**

        - id: userservice-instructors
          uri: http://localhost:8086
          predicates:
            - Path=/instructors/**

        # ── Course Service (local: 8083) ────────────────────────
        - id: courseservice-courses
          uri: http://localhost:8083
          predicates:
            - Path=/courses/**

        - id: courseservice-sections
          uri: http://localhost:8083
          predicates:
            - Path=/sections/**

        # ── Cart Service (local: 8081) ──────────────────────────
        - id: cartservice
          uri: http://localhost:8081
          predicates:
            - Path=/api/cart/**

        # ── Coupon Service (local: 8082) ────────────────────────
        - id: couponservice
          uri: http://localhost:8082
          predicates:
            - Path=/api/coupons/**

        # ── Swagger / API Docs ──────────────────────────────────
        - id: userservice-swagger-ui
          uri: http://localhost:8086
          predicates:
            - Path=/userservice/swagger-ui/**
          filters:
            - RewritePath=/userservice/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        - id: userservice-api-docs
          uri: http://localhost:8086
          predicates:
            - Path=/userservice/v3/api-docs/**
          filters:
            - RewritePath=/userservice/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}

        - id: courseservice-swagger-ui
          uri: http://localhost:8083
          predicates:
            - Path=/courseservice/swagger-ui/**
          filters:
            - RewritePath=/courseservice/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        - id: courseservice-api-docs
          uri: http://localhost:8083
          predicates:
            - Path=/courseservice/v3/api-docs/**
          filters:
            - RewritePath=/courseservice/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}

        - id: cartservice-swagger-ui
          uri: http://localhost:8081
          predicates:
            - Path=/cartservice/swagger-ui/**
          filters:
            - RewritePath=/cartservice/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        - id: cartservice-api-docs
          uri: http://localhost:8081
          predicates:
            - Path=/cartservice/v3/api-docs/**
          filters:
            - RewritePath=/cartservice/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}

        - id: couponservice-swagger-ui
          uri: http://localhost:8082
          predicates:
            - Path=/couponservice/swagger-ui/**
          filters:
            - RewritePath=/couponservice/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}
        - id: couponservice-api-docs
          uri: http://localhost:8082
          predicates:
            - Path=/couponservice/v3/api-docs/**
          filters:
            - RewritePath=/couponservice/v3/api-docs/(?<segment>.*), /v3/api-docs/$\{segment}

userservice:
  url: http://localhost:8086

logging:
  level:
    com.swachvega: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG