      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/swachvegadb
      - SPRING_DATASOURCE_USERNAME=swachvega
      - SPRING_DATASOURCE_PASSWORD=swachvega123
      - SPRING_REDIS_HOST=redis
