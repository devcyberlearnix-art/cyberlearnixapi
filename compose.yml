    restart: unless-stopped

  couponservice:
    image: swachvegaregistry.azurecr.io/couponservice:latest
    container_name: swachvega-couponservice
    ports:
      - "8096:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/swachvegadb
      - SPRING_DATASOURCE_USERNAME=swachvega
      - SPRING_DATASOURCE_PASSWORD=swachvega123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
    depends_on:
      - postgres
      - redis
      - elasticsearch
    restart: unless-stopped

  inventoryservice:
    image: swachvegaregistry.azurecr.io/inventoryservice:latest
    container_name: swachvega-inventoryservice
    ports:
      - "8084:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/swachvegadb
      - SPRING_DATASOURCE_USERNAME=swachvega
      - SPRING_DATASOURCE_PASSWORD=swachvega123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
    depends_on:
      - postgres
      - redis
      - elasticsearch
    restart: unless-stopped

  searchservice:
    image: swachvegaregistry.azurecr.io/searchservice:latest
    container_name: swachvega-searchservice
    ports:
      - "8085:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/swachvegadb
      - SPRING_DATASOURCE_USERNAME=swachvega
      - SPRING_DATASOURCE_PASSWORD=swachvega123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
    depends_on:
