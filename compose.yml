    restart: unless-stopped
  
  merchantservice:
    image: swachvegaregistry.azurecr.io/merchantservice:latest
    container_name: swachvega-merchantservice
    ports:
      - "8089:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/swachvegadb
      - SPRING_DATASOURCE_USERNAME=swachvega
      - SPRING_DATASOURCE_PASSWORD=swachvega123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
