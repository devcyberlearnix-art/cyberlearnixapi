      - elasticsearch
    restart: unless-stopped

  storeservice:
    image: swachvegaregistry.azurecr.io/storeservice:latest
    container_name: swachvega-storeservice
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/swachvegadb
      - SPRING_DATASOURCE_USERNAME=swachvega
