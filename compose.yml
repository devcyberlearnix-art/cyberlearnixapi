# CyberLearnix LMS – Full Stack Docker Compose
# Database-per-Service pattern: each microservice has its own isolated PostgreSQL database.
# All services share ONE PostgreSQL instance but use SEPARATE databases (practical for small-medium scale).
# For maximum isolation, replace with separate postgres containers per service.

services:

  # ──────────────────────────────────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cyberlearnix-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-cyberlearnix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      POSTGRES_DB: lms_user_db          # default db (required by postgres image)
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cyberlearnix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cyberlearnix-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # Microservices
  # ──────────────────────────────────────────────────────────────────────────

  userservice:
    build:
      context: ./userservice
      dockerfile: Dockerfile
    image: cyberlearnix/userservice:latest
    container_name: cyberlearnix-userservice
    environment:
      # Each service uses its OWN dedicated database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_SECRET:-myVerySecretKeyForRefreshTokenThatIsAtLeast32Chars}
      SERVER_PORT: 8086
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    image: cyberlearnix/course-service:latest
    container_name: cyberlearnix-course-service
    environment:
      # course-service uses its OWN dedicated database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_course_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      JWT_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      SERVER_PORT: 8083
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    image: cyberlearnix/cart-service:latest
    container_name: cyberlearnix-cart-service
    environment:
      # cart-service uses its OWN dedicated database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_cart_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      COURSE_SERVICE_URL: http://course-service:8083
      COUPON_SERVICE_URL: http://coupon-service:8082
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  coupon-service:
    build:
      context: ./coupon-service
      dockerfile: Dockerfile
    image: cyberlearnix/coupon-service:latest
    container_name: cyberlearnix-coupon-service
    environment:
      # coupon-service uses its OWN dedicated database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_coupon_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  wishlist-service:
    build:
      context: ./wishlist-service
      dockerfile: Dockerfile
    image: cyberlearnix/wishlist-service:latest
    container_name: cyberlearnix-wishlist-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_wishlist
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      SERVER_PORT: 8085
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      COURSE_SERVICE_URL: http://course-service:8083
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    image: cyberlearnix/order-service:latest
    container_name: cyberlearnix-order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms_order_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cyberlearnix}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cyberlearnix123}
      SERVER_PORT: 8084
      CART_SERVICE_URL: http://cart-service:8081
      COUPON_SERVICE_URL: http://coupon-service:8082
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  apigateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    image: cyberlearnix/apigateway:latest
    container_name: cyberlearnix-apigateway
    ports:
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: production
      USERSERVICE_URL: http://userservice:8086
      COURSESERVICE_URL: http://course-service:8083
      CARTSERVICE_URL: http://cart-service:8081
      COUPONSERVICE_URL: http://coupon-service:8082
      WISHLISTSERVICE_URL: http://wishlist-service:8085
      ORDERSERVICE_URL: http://order-service:8084
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_SECRET:-myVerySecretKeyForAccessTokenThatIsAtLeast32Chars}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_SECRET:-myVerySecretKeyForRefreshTokenThatIsAtLeast32Chars}
    depends_on:
      - userservice
      - course-service
      - cart-service
      - coupon-service
      - wishlist-service
      - order-service
      - redis
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
