server.port=${SERVER_PORT:8082}
spring.application.name=coupon-service

# Database – coupon-service owns lms_coupon_db exclusively
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:lms_coupon_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cyberlearnix}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cyberlearnix123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Redis (shared infrastructure – rate limiting only)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Security - JWT RSA Public Key
jwt.secret=${JWT_SECRET:8c4e9d2f1a7b6c5d9e3f0a1b7c8d4e5f9a2b6c1d8e7f3a4b5c9d1e6f8a2b7c3}
jwt.issuer=${JWT_ISSUER:cyberlearnix}
jwt.audience=${JWT_AUDIENCE:cyberlearnix-clients}

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Cache
spring.cache.type=none

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
