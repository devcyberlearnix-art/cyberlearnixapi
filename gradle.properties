# LMS Microservices - Centralized Dependency Management
# This file centralizes common dependency versions and build configurations

# Gradle Build Optimization
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.workers.max=4

# Java Toolchain
java.version=21

# Spring Boot & Spring Cloud Versions
springBootVersion=3.3.5
springCloudVersion=2023.0.3

# Third-party Library Versions
jjwtVersion=0.12.3
springdocVersion=2.3.0
lombokVersion=1.18.30
bucket4jVersion=8.7.0
jasyptVersion=1.9.3
cloudinaryVersion=2.3.2
userAgentUtilsVersion=1.21
jacksonVersion=2.15.2

# Spring AI & Admin Versions (for wishlist-service)
springAiVersion=1.1.3
springBootAdminVersion=3.3.3

# Database Versions
postgresqlVersion=42.7.4
h2Version=2.2.224

# Testing Versions
junitVersion=5.10.0
mockitoVersion=5.5.0
assertjVersion=3.24.2

# Other Dependencies
resilience4jVersion=2.1.0
flywayVersion=9.22.0
firebaseAdminVersion=9.2.0
itextpdfVersion=7.2.5

# Project Information
group=com.cyberlearnix
