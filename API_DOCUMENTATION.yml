course_service:
  base_url: "http://localhost:8083"
  base_path: "/api/v1"
  description: "Course management service"
  note: "Course IDs are Long (numeric), not UUID"
  controllers:
    course_controller:
      endpoints:
        - method: "POST"
          path: "/courses"
          description: "Create course"
          auth_required: true
          auth_type: "Instructor/Admin"
        - method: "GET"
          path: "/courses"
          description: "Get all courses (Public)"
          auth_required: false
          auth_type: "None"
        - method: "GET"
          path: "/courses/{id}"
          description: "Get course by ID (Public)"
          auth_required: false
          auth_type: "None"
        - method: "PUT"
          path: "/courses/{id}"
          description: "Update course (Full)"
          auth_required: true
          auth_type: "Instructor/Admin"
        - method: "PATCH"
          path: "/courses/{id}"
          description: "Update course (Partial)"
          auth_required: true
          auth_type: "Instructor/Admin"
        - method: "PATCH"
          path: "/courses/{id}/status"
          description: "Update course status"
          auth_required: true
          auth_type: "Admin Service"
        - method: "DELETE"
          path: "/courses/{id}"
          description: "Delete course"
          auth_required: true
          auth_type: "Instructor/Admin"
        - method: "GET"
          path: "/courses/{courseId}/students"
          description: "Get enrolled students"
          auth_required: false
          auth_type: "Public"
        - method: "POST"
          path: "/courses/{courseId}/enroll"
          description: "Enroll in free course"
          auth_required: true
          auth_type: "Student (JWT)"

    enrollment_controller:
      endpoints:
        - method: "POST"
          path: "/enrollments/internal/enroll"
          description: "Internal enrollment (S2S)"
          auth_required: true
          auth_type: "Service-to-Service"
        - method: "GET"
          path: "/enrollments/check/{courseId}"
          description: "Check enrollment status"
          auth_required: true
          auth_type: "JWT Auth"

    course_preview_controller:
      endpoints:
        - method: "POST"
          path: "/courses/{courseId}/preview"
          description: "Create course preview"
          auth_required: true
          auth_type: "Instructor/Admin"
        - method: "GET"
          path: "/courses/{courseId}/preview"
          description: "Get course preview"
          auth_required: false
          auth_type: "Public"

    lecture_controller:
      endpoints:
        - method: "POST"
          path: "/sections/{sectionId}/lectures"
          description: "Create lecture"
          auth_required: true
          auth_type: "@PreAuthorize: INSTRUCTOR, ADMIN"
        - method: "PATCH"
          path: "/sections/{sectionId}/lectures/{lectureId}"
          description: "Update lecture"
          auth_required: true
          auth_type: "@PreAuthorize: INSTRUCTOR, ADMIN"
        - method: "DELETE"
          path: "/sections/{sectionId}/lectures/{lectureId}"
          description: "Delete lecture"
          auth_required: true
          auth_type: "@PreAuthorize: INSTRUCTOR, ADMIN"
        - method: "GET"
          path: "/sections/{sectionId}/lectures"
          description: "Get lectures by section"
          auth_required: true
          auth_type: "Enrolled users"

    section_controller:
      endpoints:
        - method: "POST"
          path: "/courses/{courseId}/sections"
          description: "Create section"
          auth_required: true
          auth_type: "Instructor/Admin"
        - method: "GET"
          path: "/courses/{courseId}/sections"
          description: "Get sections by course"
          auth_required: false
          auth_type: "Public"
        - method: "PATCH"
          path: "/courses/sections/{sectionId}"
          description: "Update section"
          auth_required: true
          auth_type: "Instructor/Admin"
        - method: "DELETE"
          path: "/courses/sections/{sectionId}"
          description: "Delete section"
          auth_required: true
          auth_type: "Instructor/Admin"

