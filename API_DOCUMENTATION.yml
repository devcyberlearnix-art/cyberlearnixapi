# LMS Microservices API Documentation
# Complete API Reference for Frontend Team
# Generated: 2026-08-13
# Total Services: 12
# Total Endpoints: 229

api_gateway:
  base_url: "http://localhost:8080"
  description: "API Gateway for routing requests to microservices"
  session_management:
    base_path: "/api/sessions"
    endpoints:
      - method: "GET"
        path: "/sessions"
        description: "Get user sessions"
        auth_required: true
        auth_type: "X-User-Id, X-Session-Id headers"
      - method: "DELETE"
        path: "/sessions/{sessionId}"
        description: "Deactivate specific session"
        auth_required: true
        auth_type: "X-User-Id, X-Session-Id headers"
      - method: "POST"
        path: "/sessions/deactivate-others"
        description: "Deactivate other sessions"
        auth_required: true
        auth_type: "X-User-Id, X-Session-Id headers"
      - method: "POST"
        path: "/sessions/deactivate-all"
        description: "Deactivate all sessions"
        auth_required: true
        auth_type: "X-User-Id header"

user_service:
  base_url: "http://localhost:8081"
  base_path: "/api/v1"
  description: "User management and authentication service"
  controllers:
    user_controller:
      endpoints:
        - method: "GET"
          path: "/users/me"
          description: "Get current user profile"
          auth_required: true
          auth_type: "Bearer Token"
        - method: "PUT"
          path: "/users/me"
          description: "Update current user profile"
          auth_required: true
          auth_type: "Bearer Token"
        - method: "POST"
          path: "/users/me/photo"
          description: "Upload profile photo"
          auth_required: true
          auth_type: "Bearer Token"
        - method: "DELETE"
          path: "/users/me"
          description: "Delete user account"
          auth_required: true
          auth_type: "Bearer Token"
        - method: "GET"
          path: "/users"
          description: "Get all users (Admin)"
          auth_required: true
          auth_type: "Service Token or Admin"
        - method: "GET"
          path: "/users/{id}"
          description: "Get user by ID"
          auth_required: true
          auth_type: "Admin"
        - method: "PUT"
          path: "/users/{id}/status"
          description: "Update user status"
          auth_required: true
          auth_type: "Admin"
        - method: "DELETE"
          path: "/users/{id}"
          description: "Delete user by ID"
          auth_required: true
          auth_type: "Admin"

    registration_controller:
      endpoints:
        - method: "POST"
          path: "/auth/register"
          description: "Register new user (sends OTP)"
          auth_required: false
          auth_type: "None"
        - method: "POST"
          path: "/auth/verify-email"
          description: "Verify email with OTP"
          auth_required: false
          auth_type: "None"

    unified_authentication_controller:
      endpoints:
        - method: "POST"
          path: "/auth/login"
          description: "Unified login (Student/Instructor/Admin)"
          auth_required: false
          auth_type: "None"
        - method: "POST"
          path: "/auth/refresh"
          description: "Refresh access token"
          auth_required: true
          auth_type: "Bearer Token (Refresh)"
        - method: "POST"
          path: "/auth/logout"
          description: "Logout user"
          auth_required: true
          auth_type: "Bearer Token"
        - method: "POST"
          path: "/auth/login/otp/request"
          description: "Request login OTP"
          auth_required: false
          auth_type: "None"
        - method: "POST"
          path: "/auth/login/otp/verify"
          description: "Verify login OTP"
          auth_required: false
          auth_type: "None"
        - method: "POST"
          path: "/auth/password/forgot"
          description: "Forgot password (sends OTP)"
          auth_required: false
          auth_type: "None"
        - method: "POST"
          path: "/auth/password/verify-otp"
          description: "Verify password reset OTP"
          auth_required: false
          auth_type: "None"
        - method: "POST"
          path: "/auth/password/reset"
          description: "Reset password"
          auth_required: false
          auth_type: "Optional Bearer Token"
        - method: "POST"
          path: "/auth/change-password"
          description: "Change password (authenticated)"
          auth_required: true
          auth_type: "Bearer Token"
        - method: "POST"
          path: "/auth/switch-role"
          description: "Switch user role"
          auth_required: true
          auth_type: "Bearer Token"

    session_controller:
      endpoints:
        - method: "GET"
          path: "/users/me/sessions"
          description: "List all user sessions"
          auth_required: true
          auth_type: "Bearer Token"
        - method: "DELETE"
          path: "/users/me/sessions/{id}"
          description: "Logout specific device"
          auth_required: true
          auth_type: "Bearer Token"
        - method: "DELETE"
          path: "/users/me/sessions"
          description: "Logout from all sessions"
          auth_required: true
          auth_type: "Bearer Token"

    instructor_controller:
      endpoints:
        - method: "POST"
          path: "/instructors/applications"
          description: "Apply for instructor (multipart)"
          auth_required: true
          auth_type: "Bearer Token"
        - method: "GET"
          path: "/instructors/applications/me"
          description: "Get application status"
          auth_required: true
          auth_type: "Bearer Token"

    admin_instructor_controller:
      endpoints:
        - method: "GET"
          path: "/admin/instructors"
          description: "Get all approved instructors"
          auth_required: true
          auth_type: "@PreAuthorize: MAIN_ADMIN, SUB_ADMIN"
        - method: "GET"
          path: "/admin/instructors/applications"
          description: "Get all instructor applications"
          auth_required: true
          auth_type: "@PreAuthorize: MAIN_ADMIN, SUB_ADMIN"
        - method: "PUT"
          path: "/admin/instructors/applications/{userId}/approve"
          description: "Approve instructor application"
          auth_required: true
          auth_type: "@PreAuthorize: MAIN_ADMIN, SUB_ADMIN"
        - method: "PUT"
          path: "/admin/instructors/applications/{userId}/reject"
          description: "Reject instructor application"
          auth_required: true
          auth_type: "@PreAuthorize: MAIN_ADMIN, SUB_ADMIN"

