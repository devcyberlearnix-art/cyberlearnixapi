# Authentication Types Reference
authentication_types:
  bearer_token:
    description: "Standard JWT authentication via Authorization header"
    example: "Authorization: Bearer <token>"
  pre_authorize:
    description: "Spring Security method-level authorization with role-based access"
    roles: ["MAIN_ADMIN", "SUB_ADMIN", "INSTRUCTOR", "STUDENT", "ADMIN"]
  authentication_principal:
    description: "Spring Security principal injection for authenticated users"
  service_to_service:
    description: "Internal service communication with service tokens"
  x_user_id_header:
    description: "Gateway forwarded user identification via custom headers"
    example: "X-User-Id: <userId>, X-Session-Id: <sessionId>"
  none:
    description: "Publicly accessible endpoints without authentication"

